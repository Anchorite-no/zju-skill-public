paths = ['^lib/cc98/README\.md$']
regexes = ['^8b53f727\-08e2\-4509\-8857\-e34bf92b27f2$', '^client_id=9a1fd200\-8687\-44b1\-4c20\-08d50a96e5cd$', '^client_secret=8b53f727\-08e2\-4509\-8857\-e34bf92b27f2$']

