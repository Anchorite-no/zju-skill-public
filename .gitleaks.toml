title = "ZJU public credential checks"

[extend]
useDefault = true

# Reviewed public protocol constant; other credentials in this file still fail.
[[allowlists]]
description = "Public frontend constant in lib/cc98/auth.ts"
condition = "AND"
regexTarget = "secret"
paths = ['^lib/cc98/auth\.ts$']
regexes = ['^8b53f727\-08e2\-4509\-8857\-e34bf92b27f2$']

# Reviewed public protocol constant; other credentials in this file still fail.
[[allowlists]]
description = "Public frontend constant in lib/cc98/README.md"
